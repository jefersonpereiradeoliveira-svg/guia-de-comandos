<style>
:root{
  --bg:#FAFBFD; --surface:#FFFFFF; --ink:#0E1626; --muted:#566176; --rule:#E1E6EE;
  --code:#EEF2F8; --hover:#F3F6FB; --mark:#FFE58A; --markink:#1A1400;
  --py:#2B64AE; --java:#B83F0B; --r:#6B3FC4; --js:#15803D; --sql:#BE185D;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  --hdr:124px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1C; --surface:#10172A; --ink:#E7ECF6; --muted:#9AA6BD; --rule:#1F2A44;
    --code:#0C1322; --hover:#131C33; --mark:#6B5A12; --markink:#FFF4C2;
    --py:#7DB0F2; --java:#F59A66; --r:#BBA2FF; --js:#6EDC8F; --sql:#F48FB8;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1C; --surface:#10172A; --ink:#E7ECF6; --muted:#9AA6BD; --rule:#1F2A44;
  --code:#0C1322; --hover:#131C33; --mark:#6B5A12; --markink:#FFF4C2;
  --py:#7DB0F2; --java:#F59A66; --r:#BBA2FF; --js:#6EDC8F; --sql:#F48FB8;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 8px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.py{--lc:var(--py)} .java{--lc:var(--java)} .r{--lc:var(--r)} .js{--lc:var(--js)} .sql{--lc:var(--sql)} .cmp{--lc:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 24px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 20px;align-items:center}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;font:inherit;font-size:16px;line-height:1.4;padding:11px 44px 11px 42px;border:1.5px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted);opacity:1}
.search input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 14%,transparent)}
.search input::-webkit-search-cancel-button{display:none}
.kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px/1 var(--mono);color:var(--muted);border:1px solid var(--rule);border-radius:5px;padding:3px 7px;pointer-events:none}
.search.has .kbd{display:none}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:9px 14px;font-size:14px;font-weight:500;line-height:1.2;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.pdf{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pdf:hover{opacity:.9}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.icon{padding:9px 11px}
.only-narrow{display:none}
.filters{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;font-size:13.5px;line-height:1.3}
.fchip .dot{width:9px;height:9px;border-radius:50%;background:var(--lc,var(--muted));flex:none}
.fchip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.fchip:hover{border-color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fchip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.fchip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--bg)}

/* Layout */
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:248px minmax(0,1fr);gap:56px}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 8px);align-self:start;max-height:calc(100vh - var(--hdr) - 24px);overflow:auto;padding:28px 0 24px;scrollbar-width:thin}
.ng{margin:0 0 20px}
.gh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:0 0 6px}
.gh .dot{width:9px;height:9px;border-radius:50%;background:var(--lc)}
.nl{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;margin-left:4px;border-left:2px solid var(--rule);color:var(--muted);text-decoration:none;font-size:13.5px;line-height:1.4}
.nl b{font-weight:500;font-variant-numeric:tabular-nums}
.nl:hover{color:var(--ink)}
.nl.on{color:var(--ink);border-left-color:var(--lc);font-weight:500}
main{min-width:0}

.lead{font-size:17px;color:var(--muted);margin:0 0 10px;max-width:60ch}
.meta{font-size:14px;color:var(--muted);margin:0 0 22px}
.quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.quick > span{font-size:14px;color:var(--muted);margin-right:4px}

.qs:hover{border-color:var(--muted)}
.searching .hero{display:none}

/* Resultado */
.res{margin:28px 0 0;font-size:14.5px;color:var(--muted)}
.res strong{color:var(--ink);font-weight:600}
.lnk{border:0;background:none;padding:0 0 0 10px;text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-size:14px}
.empty{padding:48px 0}
.empty h2{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
.empty p{color:var(--muted);margin:0 0 16px}

/* Seções */
.sec{padding-top:44px}
.sh{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;border-top:2px solid var(--lc);padding-top:14px;margin-bottom:8px}

.sh .cnt{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.sec h3{font-size:16.5px;font-weight:600;letter-spacing:-.005em;margin:32px 0 10px}
.sec p{margin:0 0 14px;max-width:72ch}
.sec ul{margin:0 0 14px;padding-left:20px;max-width:72ch}

.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}

td{padding:9px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
table[data-cmd="0"] td:first-child{width:48%}
table[data-cmd="1"] td:first-child{width:30%}
.cw{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.cp:hover{color:var(--ink);border-color:var(--muted)}
@media (hover:none){.cp{opacity:1}}
.pre{position:relative;margin:0 0 14px}
.pre pre{margin:0;background:var(--code);border:1px solid var(--rule);border-radius:10px;padding:14px 52px 14px 16px;overflow-x:auto;font:13px/1.6 var(--mono)}
.pre pre code{background:none;padding:0;font-size:inherit}
.pre .cp{position:absolute;top:10px;right:10px}
mark{background:var(--mark);color:var(--markink);border-radius:3px;padding:0 1px}

/* Aviso */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Telas estreitas */
@media (max-width:900px){
  .wrap{display:block;padding:0 18px 64px}
  aside{display:none}
  .navopen aside{display:block;position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + var(--hdr));max-height:none;background:var(--bg);z-index:25;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
  .only-narrow{display:inline-flex}
  .top-in{padding:10px 18px 8px;grid-template-columns:minmax(0,1fr) auto}
  .search{grid-column:1 / -1;order:3}
  .filters{order:4}
  .hero{padding-top:28px}
}
@media (max-width:520px){
  .sh .cnt{margin-left:0;width:100%}
  th,td{padding:8px 10px}

/* Impressão e PDF do navegador */
@media print{

  body{font-size:11px;background:#fff}
  .top,aside,.hero .quick,.cp,#toast,.res .lnk{display:none!important}
  .wrap{display:block;max-width:none;padding:0}

  .sh,h3{break-after:avoid}

}

## Python: versões, instalação e troca de versão

O Python não troca de versão sozinho: você escolhe a versão com o launcher `py` (Windows), com `pyenv` ou `uv` (qualquer sistema) ou com o `conda`. Os comandos abaixo cobrem ver, instalar, fixar e remover versões.

### Ver a versão e o caminho

| Comando | Para que serve |
| --- | --- |
| `python --version` ou `python -V` | Mostra a versão do Python ativo |
| `python -VV` | Versão detalhada, com compilador e build |
| `python3 --version` | Mesmo que acima em Linux/Mac, onde `python` pode não existir |
| `where python` (Windows) | Lista todos os `python.exe` encontrados no PATH |
| `which -a python3` (Linux/Mac) | Lista todos os executáveis no PATH |
| `python -c "import sys; print(sys.executable)"` | Caminho do executável que está rodando |
| `python -c "import sys; print(sys.version_info)"` | Versão em formato de tupla (major, minor, micro) |
| `python -m site` | Mostra `sys.path`, site-packages do usuário e do sistema |
| `python -m sysconfig` | Despeja a configuração de build e os caminhos de instalação |
| `pip --version` | Versão do pip e a qual Python ele pertence |

### Windows: launcher `py`

O launcher vem com o instalador oficial e permite escolher a versão em cada comando.

| Comando | Para que serve |
| --- | --- |
| `py --list` ou `py -0` | Lista as versões instaladas |
| `py -0p` | Lista com o caminho de cada instalação |
| `py script.py` | Roda com a versão padrão do launcher |
| `py -3.12 script.py` | Roda com o Python 3.12 |
| `py -3.12 -m venv venv` | Cria um ambiente virtual com a 3.12 |
| `py -3.12 -m pip install pandas` | Instala usando o pip da 3.12 |
| `set PY_PYTHON=3.12` | Define a versão padrão do launcher na sessão do cmd |

Nas versões novas do Windows pode existir o Python Install Manager, que também usa o comando `py`: `py install 3.13` instala, `py list` lista e `py uninstall 3.13` remove. Confirme o que sua máquina tem com `py help`.

### Instalar pelo gerenciador de pacotes do sistema

| Sistema | Comando |
| --- | --- |
| Windows (winget) | `winget install Python.Python.3.12` |
| Windows (atualizar) | `winget upgrade Python.Python.3.12` |
| Windows (listar) | `winget list python` |
| macOS (Homebrew) | `brew install python@3.12` |
| macOS (atualizar) | `brew upgrade python@3.12` |
| Ubuntu/Debian | `sudo apt install python3.12 python3.12-venv python3-pip` |
| Ubuntu (versões mais novas) | `sudo add-apt-repository ppa:deadsnakes/ppa` e depois `sudo apt update` |
| Ubuntu (trocar o padrão) | `sudo update-alternatives --config python3` |
| Fedora | `sudo dnf install python3.12` |

### pyenv (Linux, Mac e pyenv-win)

O `pyenv` instala várias versões lado a lado e troca entre elas por pasta ou globalmente.

| Comando | Para que serve |
| --- | --- |
| `pyenv install --list` | Lista as versões disponíveis para instalar (no pyenv-win: `pyenv install -l`) |
| `pyenv install 3.12.7` | Instala uma versão específica |
| `pyenv versions` | Lista as versões instaladas |
| `pyenv version` | Mostra a versão ativa e de onde veio |
| `pyenv global 3.12.7` | Define a versão padrão do usuário |
| `pyenv local 3.11.9` | Fixa a versão na pasta atual (cria o arquivo `.python-version`) |
| `pyenv shell 3.10.14` | Define a versão só para o terminal aberto |
| `pyenv uninstall 3.9.18` | Remove uma versão |
| `pyenv which python` | Caminho real do `python` que o pyenv está usando |
| `pyenv rehash` | Reconstrói os atalhos após instalar pacotes com executáveis |
| `pyenv update` | Atualiza o próprio pyenv (disponível no pyenv-win) |

### uv

O `uv` baixa o Python sozinho, sem compilar, e é bem mais rápido que o pyenv.

| Comando | Para que serve |
| --- | --- |
| `uv python list` | Lista versões disponíveis e instaladas |
| `uv python install 3.13` | Baixa e instala a 3.13 |
| `uv python install 3.11 3.12 3.13` | Instala várias de uma vez |
| `uv python pin 3.12` | Grava a versão em `.python-version` no projeto |
| `uv python find` | Mostra qual Python seria usado agora |
| `uv python uninstall 3.11` | Remove uma versão |
| `uv venv --python 3.12` | Cria um ambiente virtual com a 3.12 |
| `uv run --python 3.12 script.py` | Roda um script com a versão escolhida |

### conda

No conda a versão do Python faz parte do ambiente: cada ambiente tem a sua.

| Comando | Para que serve |
| --- | --- |
| `conda create -n meuenv python=3.11` | Cria um ambiente já com o Python 3.11 |
| `conda activate meuenv` | Ativa o ambiente |
| `conda install python=3.12` | Troca a versão dentro do ambiente ativo |
| `conda search python` | Lista as versões disponíveis |
| `python --version` | Confere a versão depois de ativar |

Dentro de um ambiente virtual (`venv`) não dá para trocar a versão do Python. Crie outro ambiente com a versão desejada e reinstale os pacotes com `pip install -r requirements.txt`.

## Python: ambientes virtuais

Um ambiente virtual isola as bibliotecas de cada projeto. O básico é `python -m venv venv`; `virtualenv`, `conda`, `uv`, `poetry` e `pipenv` fazem a mesma função com recursos extras.

### venv (já vem com o Python)

| Comando | Para que serve |
| --- | --- |
| `python -m venv venv` | Cria o ambiente na pasta `venv` |
| `python -m venv .venv` | Mesma coisa, com pasta oculta (convenção de muitos editores) |
| `python -m venv venv --system-site-packages` | O ambiente enxerga também os pacotes globais |
| `python -m venv venv --clear` | Apaga o conteúdo e recria o ambiente |
| `python -m venv venv --upgrade` | Atualiza o ambiente para o Python que está rodando o comando |
| `python -m venv venv --without-pip` | Cria sem instalar o pip |
| `python -m venv venv --prompt meuapp` | Muda o nome que aparece no terminal |

### Ativar e desativar

| Terminal | Comando |
| --- | --- |
| Windows cmd | `venv\Scripts\activate` |
| Windows PowerShell | `venv\Scripts\Activate.ps1` |
| Git Bash no Windows | `source venv/Scripts/activate` |
| Linux e Mac (bash/zsh) | `source venv/bin/activate` |
| Linux e Mac (fish) | `source venv/bin/activate.fish` |
| Qualquer um | `deactivate` |

Se o PowerShell bloquear o script, rode uma vez `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned`.

### Conferir e apagar

| Comando | Para que serve |
| --- | --- |
| `where python` (Windows) ou `which python` (Linux/Mac) | Deve apontar para dentro da pasta `venv` |
| `python -c "import sys; print(sys.prefix)"` | Mostra a pasta do ambiente ativo |
| `pip list` | Lista o que está instalado no ambiente |
| `rmdir /s /q venv` (Windows) | Apaga o ambiente |
| `rm -rf venv` (Linux/Mac) | Apaga o ambiente |

O ambiente é só uma pasta: não copie para outra máquina, recrie com `pip install -r requirements.txt`. Coloque `venv/` no `.gitignore`.

### virtualenv (alternativa ao venv)

| Comando | Para que serve |
| --- | --- |
| `pip install virtualenv` | Instala a ferramenta |
| `virtualenv venv` | Cria o ambiente |
| `virtualenv -p python3.11 venv` | Cria com uma versão específica |
| `virtualenv --clear venv` | Recria limpando o conteúdo |

### conda

| Comando | Para que serve |
| --- | --- |
| `conda create -n nome python=3.11` | Cria um ambiente com a versão escolhida |
| `conda create -n nome python=3.11 pandas numpy` | Já cria com pacotes instalados |
| `conda create --prefix ./env python=3.11` | Cria o ambiente dentro da pasta do projeto |
| `conda activate nome` | Ativa |
| `conda deactivate` | Desativa |
| `conda env list` | Lista os ambientes |
| `conda list` | Lista pacotes do ambiente ativo |
| `conda install pacote` | Instala um pacote |
| `conda install -c conda-forge pacote` | Instala usando o canal conda-forge |
| `conda update pacote` | Atualiza um pacote |
| `conda remove pacote` | Remove um pacote |
| `conda env export > environment.yml` | Exporta o ambiente completo |
| `conda env export --from-history > environment.yml` | Exporta só o que você instalou de propósito |
| `conda env create -f environment.yml` | Recria um ambiente a partir do arquivo |
| `conda env update -f environment.yml --prune` | Atualiza o ambiente e remove o que saiu do arquivo |
| `conda create -n novo --clone antigo` | Copia um ambiente |

## Python: pip

O `pip` instala, lista, atualiza e remove bibliotecas. Prefira chamar como `python -m pip`, que garante que o pip é o do Python que você está usando.

### Instalar

| Comando | Para que serve |
| --- | --- |
| `pip install pacote` | Instala a versão mais recente |
| `pip install pacote==1.2.3` | Instala uma versão exata |
| `pip install "pacote>=1.2,<2"` | Instala dentro de uma faixa de versões |
| `pip install pacote1 pacote2` | Instala vários de uma vez |
| `pip install pacote[extra]` | Instala com dependências opcionais (extras) |
| `pip install -r requirements.txt` | Instala tudo que está no arquivo |
| `pip install -U pacote` | Atualiza um pacote (`--upgrade`) |
| `python -m pip install --upgrade pip` | Atualiza o próprio pip |
| `pip install -e .` | Instala o projeto da pasta atual em modo editável |
| `pip install .` | Instala o projeto da pasta atual |
| `pip install ./arquivo.whl` | Instala a partir de um arquivo local |
| `pip install git+https://github.com/usuario/repo.git` | Instala direto de um repositório Git |
| `pip install --user pacote` | Instala só para o usuário atual |
| `pip install --no-deps pacote` | Instala sem as dependências |
| `pip install --force-reinstall pacote` | Reinstala mesmo que já esteja instalado |
| `pip install --no-cache-dir pacote` | Ignora o cache de downloads |
| `pip install --pre pacote` | Aceita versões pré-lançamento (alpha, beta, rc) |
| `pip install --dry-run pacote` | Mostra o que seria instalado, sem instalar |
| `pip install -c constraints.txt -r requirements.txt` | Instala respeitando um arquivo de restrições de versão |
| `pip install --require-hashes -r requirements.txt` | Exige o hash de cada pacote (mais seguro) |

### Origem dos pacotes, proxy e rede

| Comando | Para que serve |
| --- | --- |
| `pip install --index-url URL pacote` | Usa outro índice no lugar do PyPI |
| `pip install --extra-index-url URL pacote` | Usa outro índice além do PyPI |
| `pip install --trusted-host host pacote` | Aceita um host sem HTTPS válido (use só em rede interna) |
| `pip install --proxy http://usuario:senha@host:porta pacote` | Instala atrás de proxy |
| `pip install --no-index --find-links=pasta pacote` | Instala offline a partir de uma pasta de arquivos |

### Formato do requirements.txt

```text
pandas==2.2.3      # versão exata
requests>=2.31     # a partir da 2.31
streamlit~=1.40    # compatível: 1.40 ou superior, abaixo de 2.0
plotly             # qualquer versão
uvicorn[standard]  # com extras
-r dev-requirements.txt
git+https://github.com/usuario/repo.git@main
```

### Ferramentas que complementam o pip

| Comando | Para que serve |
| --- | --- |
| `pip install pip-tools` | Instala o `pip-compile` e o `pip-sync` |
| `pip-compile requirements.in` | Gera um `requirements.txt` com todas as versões fixadas |
| `pip-sync` | Deixa o ambiente igual ao `requirements.txt` |
| `pip install pipdeptree` e `pipdeptree` | Mostra a árvore de dependências |

### Erros comuns

- `externally-managed-environment` (Linux recente): o Python do sistema bloqueia o pip. Crie um `venv` e instale lá. `--break-system-packages` existe, mas não é recomendado.
- `'pip' is not recognized` (Windows): use `py -m pip` ou `python -m pip`.
- Erro de SSL em rede corporativa: configure o certificado ou o proxy da empresa antes de usar `--trusted-host`.

## Python: executar scripts e opções da linha de comando

O comando `python` aceita um arquivo, um módulo (`-m`) ou um trecho de código (`-c`), e várias opções que mudam como o interpretador se comporta.

## Java: JDK, versões e troca de versão

Para programar em Java você precisa do JDK (que inclui o compilador `javac`); o JRE sozinho só executa programas. A versão ativa é a que aparece primeiro no `PATH`, e o `JAVA_HOME` diz às ferramentas (Maven, Gradle, IDEs) qual JDK usar. As versões LTS (suporte de longo prazo) são 8, 11, 17, 21 e 25.

### Ver a versão e o caminho

| Comando | Para que serve |
| --- | --- |
| `java -version` | Versão do Java que executa os programas |
| `java --version` | Mesma coisa, formato novo (Java 9 ou superior) |
| `javac -version` | Versão do compilador (confirma que é um JDK) |
| `java -XshowSettings:properties -version` | Mostra todas as propriedades, incluindo `java.home` |
| `java -XshowSettings:vm -version` | Mostra a memória padrão da JVM |
| `where java` (Windows) | Lista os `java.exe` encontrados no PATH |
| `which -a java` (Linux/Mac) | Lista os executáveis no PATH |
| `echo %JAVA_HOME%` (cmd) | Mostra o `JAVA_HOME` |
| `$env:JAVA_HOME` (PowerShell) | Mostra o `JAVA_HOME` |
| `echo $JAVA_HOME` (Linux/Mac) | Mostra o `JAVA_HOME` |
| `/usr/libexec/java_home -V` (macOS) | Lista todos os JDKs instalados |
| `update-alternatives --list java` (Debian/Ubuntu) | Lista os Java instalados |

### Instalar um JDK

| Sistema | Comando |
| --- | --- |
| Windows (winget, Temurin) | `winget install EclipseAdoptium.Temurin.21.JDK` |
| Windows (winget, Microsoft) | `winget install Microsoft.OpenJDK.21` |
| Windows (Chocolatey) | `choco install temurin21` |
| macOS (Homebrew) | `brew install --cask temurin@21` |
| macOS (OpenJDK) | `brew install openjdk@21` |
| Ubuntu/Debian | `sudo apt install openjdk-21-jdk` |
| Ubuntu/Debian (procurar) | `apt search openjdk` |
| Fedora | `sudo dnf install java-21-openjdk-devel` |

No macOS, o `brew install openjdk@21` não registra o JDK no sistema. Para o `java_home` enxergar, rode `sudo ln -sfn /opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk /Library/Java/JavaVirtualMachines/openjdk-21.jdk`.

### Trocar de versão sem ferramenta extra

| Sistema | Comando |
| --- | --- |
| Linux Debian/Ubuntu | `sudo update-alternatives --config java` e depois `sudo update-alternatives --config javac` |
| Windows cmd (só nesta sessão) | `set JAVA_HOME=C:\Program Files\Eclipse Adoptium\jdk-21` e `set PATH=%JAVA_HOME%\bin;%PATH%` |
| Windows PowerShell (só nesta sessão) | `$env:JAVA_HOME="C:\Program Files\Eclipse Adoptium\jdk-21"` e `$env:Path="$env:JAVA_HOME\bin;$env:Path"` |
| Windows (permanente) | Painel de Controle, Variáveis de Ambiente: edite `JAVA_HOME` e coloque `%JAVA_HOME%\bin` no começo do `Path` |
| macOS (sessão) | `export JAVA_HOME=$(/usr/libexec/java_home -v 21)` e `export PATH=$JAVA_HOME/bin:$PATH` |
| Linux (sessão) | `export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64` e `export PATH=$JAVA_HOME/bin:$PATH` |

Para deixar permanente no Linux/Mac, coloque as linhas `export` em `~/.bashrc` ou `~/.zshrc`. Ajuste o caminho do JDK para o que existe na sua máquina.

## Java: compilar, executar e empacotar

O fluxo básico é `javac` para compilar, `java` para executar e `jar` para empacotar. No classpath (`-cp`), o separador é `;` no Windows e `:` no Linux/Mac.

### Compilar com javac

| Comando | Para que serve |
| --- | --- |
| `javac Main.java` | Compila um arquivo e gera `Main.class` |
| `javac -d out Main.java` | Gera os `.class` na pasta `out` |
| `javac -d out @fontes.txt` | Compila a lista de arquivos do `fontes.txt` (um por linha) |
| `find src -name "*.java" > fontes.txt` | Linux/Mac: gera a lista de todos os `.java` |
| `dir /s /b src\*.java > fontes.txt` | Windows cmd: gera a lista de todos os `.java` |
| `javac -cp "lib/*" -d out Main.java` | Compila usando os jars da pasta `lib` |
| `javac -sourcepath src -d out src/pacote/Main.java` | Procura as outras classes na pasta `src` |
| `javac -encoding UTF-8 Main.java` | Define a codificação do código-fonte |
| `javac --release 17 Main.java` | Gera código compatível com o Java 17 |
| `javac -Xlint:all Main.java` | Mostra todos os avisos |
| `javac -Werror Main.java` | Trata avisos como erros |
| `javac -g Main.java` | Inclui informação de depuração |
| `javac -verbose Main.java` | Mostra o que o compilador está fazendo |
| `javac --module-path mods -d out @fontes.txt` | Compila usando módulos |

### Executar com java

| Comando | Para que serve |
| --- | --- |
| `java Main` | Executa a classe `Main` (sem `.class` no nome) |
| `java -cp out pacote.Main` | Executa uma classe que está num pacote |
| `java -cp "out;lib/*" pacote.Main` | Windows: inclui os jars da pasta `lib` |
| `java -cp "out:lib/*" pacote.Main` | Linux/Mac: inclui os jars da pasta `lib` |
| `java Main.java` | Compila e executa o arquivo direto (Java 11 ou superior) |
| `java -jar app.jar` | Executa um jar com `Main-Class` no manifesto |
| `java -jar app.jar arg1 arg2` | Executa passando argumentos |
| `java -Xms256m -Xmx1g -jar app.jar` | Define memória inicial e máxima do heap |
| `java -Dchave=valor -jar app.jar` | Define uma propriedade do sistema |
| `java -Dfile.encoding=UTF-8 -jar app.jar` | Força a codificação de arquivos |
| `java -Duser.timezone=America/Sao_Paulo -jar app.jar` | Define o fuso horário |
| `java -ea -jar app.jar` | Liga os `assert` |
| `java --enable-preview --source 21 Main.java` | Usa recursos em pré-visualização (a versão deve ser a do JDK) |
| `java --module-path mods -m modulo/pacote.Main` | Executa uma aplicação modular |
| `java --list-modules` | Lista os módulos disponíveis |
| `java --describe-module java.sql` | Descreve um módulo |
| `java -verbose:class -jar app.jar` | Mostra cada classe carregada |
| `java -XX:+PrintFlagsFinal -version` | Lista todas as flags da JVM com os valores atuais |
| `java @argumentos.txt` | Lê as opções de um arquivo |
| `java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -jar app.jar` | Abre a porta 5005 para depuração remota |

A variável de ambiente `JAVA_TOOL_OPTIONS` (por exemplo `-Xmx512m`) é lida por toda JVM iniciada no terminal.

### Empacotar com jar

| Comando | Para que serve |
| --- | --- |
| `jar cf app.jar -C out .` | Cria um jar com o conteúdo da pasta `out` |

Main-Class: pacote.Main
Class-Path: lib/dependencia.jar
```

## Java: Maven e Gradle

Maven (arquivo `pom.xml`) e Gradle (`build.gradle` ou `build.gradle.kts`) compilam, testam, baixam dependências e empacotam o projeto. Em projetos reais, use o wrapper (`mvnw` ou `gradlew`), que baixa a versão certa da ferramenta e dispensa instalação.

### Maven: ciclo de vida

Cada fase executa também todas as anteriores: `package` roda `compile` e `test` antes.

| Comando | Para que serve |
| --- | --- |
| `mvn -v` | Mostra a versão do Maven, do Java e do sistema |
| `mvn validate` | Valida o `pom.xml` |
| `mvn compile` | Compila o código para a pasta `target/classes` |
| `mvn test` | Compila e roda os testes |
| `mvn package` | Gera o `.jar` (ou `.war`) na pasta `target` |
| `mvn verify` | Roda também os testes de integração |
| `mvn install` | Copia o resultado para o repositório local (`~/.m2/repository`) |
| `mvn deploy` | Publica no repositório remoto configurado |
| `mvn clean` | Apaga a pasta `target` |
| `mvn clean install` | Limpa e instala (o comando mais comum) |
| `mvn clean package -DskipTests` | Empacota sem rodar os testes (ainda compila os testes) |
| `mvn clean package -Dmaven.test.skip=true` | Empacota sem compilar nem rodar os testes |
| `mvn test -Dtest=NomeTest` | Roda uma classe de teste |
| `mvn test -Dtest=NomeTest#metodo` | Roda um único método de teste |

## Java: diagnóstico, monitoramento e flags da JVM

O JDK traz ferramentas para ver o que uma aplicação Java está fazendo: `jps` e `jcmd` encontram o processo (o PID), e as demais mostram threads, memória e coleta de lixo. Nos exemplos, `PID` é o número do processo.

### Processos, threads e memória

| Comando | Para que serve |
| --- | --- |
| `jps -lv` | Lista os processos Java com a classe ou jar e as opções |
| `jcmd` | Lista os processos Java (sem argumentos) |
| `jcmd PID help` | Lista o que dá para pedir àquele processo |
| `jcmd PID VM.version` | Versão da JVM do processo |
| `jcmd PID VM.flags` | Flags da JVM em uso |
| `jcmd PID VM.system_properties` | Propriedades do sistema do processo |
| `jcmd PID Thread.print` | Imprime as threads (thread dump) |
| `jcmd PID GC.heap_info` | Resumo do uso do heap |
| `jcmd PID GC.run` | Pede uma coleta de lixo |
| `jcmd PID GC.heap_dump arquivo.hprof` | Gera um heap dump |
| `jstack PID` | Imprime as threads, útil para achar travamentos |
| `jstack -l PID` | Inclui informações de locks |
| `jmap -histo PID` | Histograma de objetos por classe |
| `jmap -histo:live PID` | Mesmo histograma, só com objetos vivos |
| `jmap -dump:live,format=b,file=heap.hprof PID` | Gera um heap dump |
| `jstat -gcutil PID 1000 10` | Uso de memória e GC a cada 1 segundo, 10 vezes |
| `jstat -gc PID 1000` | Valores absolutos de memória e GC, a cada 1 segundo |
| `jstat -class PID` | Quantidade de classes carregadas |
| `jinfo -flags PID` | Flags da JVM |
| `jinfo -sysprops PID` | Propriedades do sistema |
| `kill -3 PID` (Linux/Mac) | Imprime o thread dump na saída do processo |
| `Ctrl+Break` (Windows) | Imprime o thread dump no console onde o programa roda |

Analise arquivos `.hprof` no Eclipse MAT, VisualVM ou IntelliJ.

### Flags da JVM: memória e coleta de lixo

| Flag | Para que serve |
| --- | --- |
| `-Xms512m` | Tamanho inicial do heap |
| `-Xmx2g` | Tamanho máximo do heap |
| `-Xss1m` | Tamanho da pilha de cada thread |
| `-XX:MaxMetaspaceSize=256m` | Limite do metaspace (metadados de classes) |
| `-XX:MaxRAMPercentage=75` | Heap máximo como porcentagem da memória (bom em containers) |
| `-XX:+UseG1GC` | Coletor G1 (padrão nas versões atuais) |
| `-XX:+UseZGC` | Coletor ZGC, de baixa latência |
| `-XX:+UseParallelGC` | Coletor Parallel, focado em vazão |
| `-XX:+UseSerialGC` | Coletor Serial, para apps pequenos |
| `-XX:+HeapDumpOnOutOfMemoryError` | Gera um heap dump quando faltar memória |
| `-XX:HeapDumpPath=/tmp/` | Pasta onde o heap dump é salvo |
| `-XX:+ExitOnOutOfMemoryError` | Encerra a JVM ao faltar memória |
| `-Xlog:gc*:file=gc.log` | Grava o log de GC em arquivo (Java 9 ou superior) |
| `-XX:+PrintFlagsFinal` | Lista todas as flags com os valores finais |
| `-XX:StartFlightRecording=duration=60s,filename=rec.jfr` | Grava um perfil com o Java Flight Recorder |
| `-XX:NativeMemoryTracking=summary` | Liga o rastreio de memória nativa (consulte com `jcmd PID VM.native_memory summary`) |

## R: instalação, versões e execução

O R roda de três jeitos: no console interativo (`R`), em scripts (`Rscript`) e em lote (`R CMD BATCH`). Diferente do Python, o R não tem um `venv` embutido: para ter várias versões use o `rig`, e para isolar pacotes por projeto use o `renv` (próxima seção).

### Instalar o R

| Sistema | Comando |
| --- | --- |
| Windows (winget) | `winget install RProject.R` |
| Windows (ferramentas de compilação, Rtools) | `winget install RProject.Rtools` |
| macOS (Homebrew) | `brew install --cask r` |
| Ubuntu/Debian | `sudo apt install r-base r-base-dev` |
| Fedora | `sudo dnf install R` |
| conda | `conda install -c conda-forge r-base` |
| Windows (atualizar pelo console do R) | `install.packages("installr")` e depois `installr::updateR()` |

O Ubuntu costuma trazer uma versão antiga do R. Para a mais recente, adicione o repositório oficial do CRAN seguindo as instruções de cloud.r-project.org/bin/linux/ubuntu.

## R: pacotes, ambientes e comandos do console

No R, os pacotes são instalados e atualizados por funções dentro do próprio console (ou com `Rscript -e`). O `renv` faz o papel do `venv` + `requirements.txt`: cada projeto ganha a sua biblioteca de pacotes e um arquivo `renv.lock` com as versões.

JavaScript roda no navegador e no Node.js. Os comandos abaixo são do Node.js e dos gerenciadores de versão: `nvm`, `fnm` e `Volta`. As versões pares do Node (22, 24 e assim por diante) viram LTS, a linha de suporte longo recomendada para uso no dia a dia.

| Rodar script | `npm run dev` | `pnpm run dev` | `yarn dev` | `bun run dev` |
| Executar sem instalar | `npx pacote` | `pnpm dlx pacote` | `yarn dlx pacote` | `bunx pacote` |

## SQL: consultas básicas

Toda consulta começa com `SELECT` (o que trazer) e `FROM` (de onde trazer). Os exemplos usam duas tabelas de previdência: `clientes` (id, nome, cidade, uf, data_cadastro) e `aportes` (id, cliente_id, plano, valor, data_aporte).

### SELECT, FROM e WHERE

| Comando | Para que serve |
| --- | --- |
| `SELECT * FROM clientes;` | Traz todas as colunas e todas as linhas |
| `SELECT nome, uf FROM clientes;` | Traz só as colunas escolhidas |
| `SELECT nome FROM clientes WHERE uf = 'SP';` | Filtra as linhas por uma condição |
| `SELECT DISTINCT uf FROM clientes;` | Remove valores repetidos |
| `SELECT nome AS cliente FROM clientes c;` | Dá apelido à coluna (`AS`) e à tabela (`c`) |
| `SELECT valor * 12 AS anual FROM aportes;` | Cria uma coluna calculada |

Texto e datas vão entre aspas simples (`'SP'`, `'2025-01-15'`); números, sem aspas. Termine cada instrução com `;` e comente com `--` ou `/* ... */`.

### Ordenar e limitar

| Comando | Para que serve |
| --- | --- |
| `ORDER BY valor DESC` | Ordena do maior para o menor (`ASC` é o padrão) |
| `ORDER BY uf, nome` | Ordena por mais de uma coluna |
| `SELECT TOP 10 * FROM aportes` | Limita a 10 linhas no SQL Server |
| `SELECT * FROM aportes LIMIT 10` | Limita a 10 linhas no PostgreSQL, MySQL e SQLite |
| `OFFSET 0 ROWS FETCH NEXT 10 ROWS ONLY` | Forma padrão (Oracle, PostgreSQL, SQL Server 2012+) |

### O asterisco (*)

| Comando | Para que serve |
| --- | --- |
| `SELECT * FROM clientes` | Todas as colunas da tabela |
| `SELECT c.*, a.valor FROM clientes c JOIN aportes a ON a.cliente_id = c.id` | Todas as colunas de uma tabela só, dentro de um JOIN |
| `SELECT COUNT(*) FROM clientes` | Conta todas as linhas, inclusive as que têm NULL |
| `SELECT valor * 12 FROM aportes` | Multiplicação |

Use `SELECT *` para explorar uma tabela; em relatórios e automações liste as colunas pelo nome. No `LIKE` o coringa é `%`, não `*`.

## SQL: filtros e operadores

Os operadores ficam no `WHERE`, no `HAVING` e no `ON`. `AND` é avaliado antes de `OR`, então use parênteses para combinar condições.

| Comando | Para que serve |
| --- | --- |
| `uf = 'SP'` | Igual |
| `plano <> 'PGBL'` | Diferente (também `!=`) |
| `valor >= 500` | Maior ou igual (também `>`, `<`, `<=`) |
| `uf = 'SP' AND valor > 100` | As duas condições precisam ser verdadeiras |
| `uf = 'SP' OR uf = 'PR'` | Basta uma condição ser verdadeira |
| `NOT uf = 'SP'` | Nega a condição |
| `uf IN ('SP', 'PR', 'MG')` | Valor está na lista |
| `valor BETWEEN 300 AND 800` | Entre dois valores, incluindo os extremos |
| `nome LIKE 'A%'` | Começa com A (`%` = qualquer quantidade de caracteres) |
| `nome LIKE '%ar%'` | Contém "ar" |
| `nome LIKE '_r%'` | Segunda letra é r (`_` = exatamente um caractere) |
| `cidade IS NULL` | Valor vazio |
| `cidade IS NOT NULL` | Valor preenchido |

`NULL` não é igual a nada, nem a outro `NULL`: `WHERE cidade = NULL` nunca retorna linhas. E `NOT IN` com uma subconsulta que tenha `NULL` também não retorna nada; prefira `NOT EXISTS`.

## SQL: agregação, agrupamento e JOINs

Funções de agregação resumem várias linhas em um valor; `GROUP BY` faz esse resumo por grupo, e `JOIN` junta tabelas por uma coluna em comum.

### Funções de agregação

| Comando | Para que serve |
| --- | --- |
| `COUNT(*)` | Conta linhas |
| `COUNT(cidade)` | Conta valores não nulos |
| `COUNT(DISTINCT uf)` | Conta valores diferentes |
| `SUM(valor)` | Soma |
| `AVG(valor)` | Média |
| `MIN(valor)` / `MAX(valor)` | Menor e maior valor |

### GROUP BY e HAVING

```
SELECT plano, COUNT(*) AS qtd, SUM(valor) AS total
FROM aportes
WHERE data_aporte >= '2025-01-01'   -- filtra linhas antes de agrupar
GROUP BY plano
HAVING SUM(valor) > 1000;           -- filtra grupos depois de agrupar
```

Toda coluna do `SELECT` que não está dentro de uma função de agregação precisa estar no `GROUP BY`.

### Tipos de JOIN

| Comando | Para que serve |
| --- | --- |
| `INNER JOIN aportes a ON a.cliente_id = c.id` | Só linhas que têm correspondência nos dois lados (`JOIN` sozinho é igual) |
| `LEFT JOIN aportes a ON a.cliente_id = c.id` | Tudo da tabela da esquerda e o que bater da direita |
| `RIGHT JOIN aportes a ON a.cliente_id = c.id` | Tudo da direita e o que bater da esquerda |
| `FULL OUTER JOIN aportes a ON a.cliente_id = c.id` | Tudo dos dois lados (não existe no MySQL) |
| `CROSS JOIN aportes` | Todas as combinações entre as duas tabelas |
| `JOIN clientes c2 ON c1.uf = c2.uf AND c1.id < c2.id` | Self join: a tabela com ela mesma |
| `LEFT JOIN ... WHERE a.id IS NULL` | Linhas da esquerda sem correspondência (ex.: clientes sem aporte) |

```
SELECT c.nome, a.plano, a.valor
FROM clientes c
LEFT JOIN aportes a ON a.cliente_id = c.id;
```

### Empilhar resultados

| Comando | Para que serve |
| --- | --- |
| `UNION` | Junta as linhas de duas consultas e remove duplicados |
| `UNION ALL` | Junta mantendo duplicados (mais rápido) |
| `INTERSECT` | Só as linhas que estão nas duas consultas |
| `EXCEPT` | Linhas da primeira que não estão na segunda (`MINUS` no Oracle) |

## SQL: subconsultas, CTE, CASE e funções de janela

Estes recursos resolvem a maior parte dos relatórios sem tabelas temporárias.

### Subconsultas e EXISTS

| Comando | Para que serve |
| --- | --- |
| `WHERE valor > (SELECT AVG(valor) FROM aportes)` | Compara com um valor calculado por outra consulta |
| `WHERE id IN (SELECT cliente_id FROM aportes)` | Filtra por uma lista vinda de outra consulta |
| `WHERE EXISTS (SELECT 1 FROM aportes a WHERE a.cliente_id = c.id)` | Verifica se existe ao menos uma linha |
| `WHERE NOT EXISTS (SELECT 1 FROM aportes a WHERE a.cliente_id = c.id)` | Verifica se não existe nenhuma linha |

### CTE com WITH

```
WITH total_cliente AS (
    SELECT cliente_id, SUM(valor) AS total
    FROM aportes
    GROUP BY cliente_id
)
SELECT c.nome, t.total
FROM total_cliente t
JOIN clientes c ON c.id = t.cliente_id
WHERE t.total > 500;
```

### CASE WHEN

```
SELECT valor,
    CASE
        WHEN valor >= 1000 THEN 'Alto'
        WHEN valor >= 500  THEN 'Médio'
        ELSE 'Baixo'
    END AS faixa,
    SUM(CASE WHEN plano = 'PGBL' THEN valor ELSE 0 END) OVER () AS total_pgbl
FROM aportes;
```

### Funções de janela (OVER)

Calculam sobre um grupo de linhas sem juntar as linhas num resultado só. `PARTITION BY` define o grupo e `ORDER BY` a ordem dentro dele.

| Comando | Para que serve |
| --- | --- |
| `ROW_NUMBER() OVER (PARTITION BY cliente_id ORDER BY data_aporte)` | Numera 1, 2, 3 dentro de cada grupo |
| `RANK() OVER (ORDER BY valor DESC)` | Ranking com saltos em empates (1, 1, 3) |
| `DENSE_RANK() OVER (ORDER BY valor DESC)` | Ranking sem saltos (1, 1, 2) |
| `LAG(valor) OVER (PARTITION BY cliente_id ORDER BY data_aporte)` | Valor da linha anterior |
| `LEAD(valor) OVER (PARTITION BY cliente_id ORDER BY data_aporte)` | Valor da linha seguinte |
| `SUM(valor) OVER (PARTITION BY cliente_id ORDER BY data_aporte)` | Soma acumulada |
| `AVG(valor) OVER (ORDER BY data_aporte ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)` | Média móvel de 3 linhas |

Último registro de cada cliente:

```
WITH ult AS (
    SELECT *, ROW_NUMBER() OVER (PARTITION BY cliente_id ORDER BY data_aporte DESC) AS rn
    FROM aportes
)
SELECT * FROM ult WHERE rn = 1;
```

## SQL: inserir, alterar e apagar dados

Antes de um `UPDATE` ou `DELETE`, rode um `SELECT` com o mesmo `WHERE` para ver quais linhas serão afetadas. Sem `WHERE`, os dois comandos atingem a tabela inteira.

### INSERT, UPDATE, DELETE e MERGE

| Comando | Para que serve |
| --- | --- |
| `INSERT INTO clientes (id, nome, uf) VALUES (5, 'Elisa', 'SP');` | Insere uma linha |
| `INSERT INTO aportes (id, cliente_id, plano, valor, data_aporte) VALUES (6, 5, 'PGBL', 400, '2025-07-10'), (7, 5, 'VGBL', 250, '2025-07-10');` | Insere várias linhas de uma vez |
| `INSERT INTO historico (cliente_id, valor) SELECT cliente_id, valor FROM aportes;` | Insere o resultado de uma consulta |
| `UPDATE clientes SET cidade = 'Belo Horizonte' WHERE id = 4;` | Altera valores |
| `UPDATE aportes SET valor = valor * 1.10 WHERE plano = 'VGBL';` | Altera com cálculo |
| `DELETE FROM aportes WHERE cliente_id = 9;` | Apaga linhas |
| `MERGE INTO destino USING origem ON destino.id = origem.id WHEN MATCHED THEN UPDATE ... WHEN NOT MATCHED THEN INSERT ...;` | Atualiza se existe, insere se não existe (SQL Server e Oracle) |
| `INSERT ... ON CONFLICT (id) DO UPDATE SET ...` | Mesmo que o MERGE, no PostgreSQL |
| `INSERT ... ON DUPLICATE KEY UPDATE ...` | Mesmo que o MERGE, no MySQL |

### Transações

| Comando | Para que serve |
| --- | --- |
| `BEGIN TRANSACTION;` | Abre a transação no SQL Server (`BEGIN;` ou `START TRANSACTION;` no PostgreSQL e no MySQL) |
| `COMMIT;` | Grava de vez tudo o que foi feito |
| `ROLLBACK;` | Desfaz tudo desde o início da transação |
| `SAVEPOINT p1;` | Cria um ponto intermediário (`SAVE TRANSACTION p1` no SQL Server) |
| `ROLLBACK TO p1;` | Volta só até o ponto intermediário (`ROLLBACK TRANSACTION p1` no SQL Server) |

Para mexer em produção com segurança: abra a transação, rode o comando, confira com `SELECT` e só então dê `COMMIT`.

## SQL: estrutura do banco e permissões

Os comandos de estrutura (DDL) criam e alteram tabelas, índices e views. Na maioria dos bancos eles não são desfeitos com `ROLLBACK` (SQL Server e PostgreSQL são exceções).

### Criar e alterar tabelas

```
CREATE TABLE aportes (
    id          INT PRIMARY KEY,
    cliente_id  INT NOT NULL,
    plano       VARCHAR(4) CHECK (plano IN ('PGBL', 'VGBL')),
    valor       DECIMAL(15,2) NOT NULL CHECK (valor > 0),
    data_aporte DATE NOT NULL,
    FOREIGN KEY (cliente_id) REFERENCES clientes(id)
);
```

| Comando | Para que serve |
| --- | --- |
| `ALTER TABLE clientes ADD email VARCHAR(120);` | Adiciona uma coluna |
| `ALTER TABLE clientes DROP COLUMN email;` | Remove uma coluna |
| `ALTER TABLE clientes ALTER COLUMN cidade VARCHAR(80);` | Muda o tipo no SQL Server |
| `ALTER TABLE clientes ALTER COLUMN cidade TYPE VARCHAR(80);` | Muda o tipo no PostgreSQL |
| `ALTER TABLE clientes MODIFY cidade VARCHAR(80);` | Muda o tipo no MySQL e no Oracle |
| `ALTER TABLE clientes ADD CONSTRAINT uq_nome UNIQUE (nome);` | Adiciona uma restrição |
| `TRUNCATE TABLE aportes;` | Esvazia a tabela, mantendo a estrutura (bem mais rápido que DELETE) |
| `DROP TABLE aportes;` | Apaga a tabela inteira |

### Tipos de dados e restrições

| Comando | Para que serve |
| --- | --- |
| `INT` / `BIGINT` | Números inteiros |
| `DECIMAL(15,2)` | Números exatos: use para dinheiro e cotas |
| `FLOAT` | Números aproximados: evite para valores financeiros |
| `VARCHAR(100)` | Texto de tamanho variável (`NVARCHAR` no SQL Server para Unicode) |
| `CHAR(2)` | Texto de tamanho fixo, bom para UF e códigos |
| `DATE` / `DATETIME` / `TIMESTAMP` | Data, ou data e hora |
| `PRIMARY KEY` | Identifica a linha: valor único e não nulo |
| `FOREIGN KEY ... REFERENCES` | O valor precisa existir na outra tabela |
| `NOT NULL` | A coluna sempre tem valor |
| `UNIQUE` | Não permite valores repetidos |
| `CHECK (valor > 0)` | O valor precisa obedecer à regra |
| `DEFAULT 0` | Valor usado quando nada é informado |

### Índices, views e permissões

| Comando | Para que serve |
| --- | --- |
| `CREATE INDEX ix_aportes_cliente ON aportes (cliente_id);` | Acelera buscas e JOINs nessa coluna |
| `CREATE UNIQUE INDEX ix_nome ON clientes (nome);` | Índice que também impede repetidos |
| `DROP INDEX ix_aportes_cliente ON aportes;` | Remove o índice (SQL Server; nos outros, sem o `ON`) |
| `CREATE VIEW vw_total AS SELECT cliente_id, SUM(valor) AS total FROM aportes GROUP BY cliente_id;` | Salva uma consulta com nome, usada como tabela |
| `DROP VIEW vw_total;` | Remove a view |
| `GRANT SELECT ON clientes TO analista;` | Dá permissão de leitura |
| `GRANT SELECT, INSERT, UPDATE ON aportes TO operador;` | Dá várias permissões |
| `REVOKE INSERT ON aportes FROM operador;` | Retira uma permissão |

## SQL: funções por banco e ordem de execução

As funções são onde os bancos mais diferem. A tabela mostra o equivalente em SQL Server, PostgreSQL e MySQL.

### Funções de texto, data, número e nulos

| Tarefa | SQL Server | PostgreSQL | MySQL |
| --- | --- | --- | --- |
| Concatenar | `CONCAT(a, b)` ou `a + b` | `CONCAT(a, b)` ou `a \|\| b` | `CONCAT(a, b)` |
| Maiúscula / minúscula | `UPPER(t)` / `LOWER(t)` | `UPPER(t)` / `LOWER(t)` | `UPPER(t)` / `LOWER(t)` |
| Primeira letra maiúscula | Não tem (criar função) | `INITCAP(t)` | Não tem (criar função) |
| Tamanho do texto | `LEN(t)` | `LENGTH(t)` | `CHAR_LENGTH(t)` |
| Pedaço do texto | `SUBSTRING(t, 1, 3)` | `SUBSTRING(t, 1, 3)` | `SUBSTRING(t, 1, 3)` |
| Tirar espaços | `TRIM(t)` | `TRIM(t)` | `TRIM(t)` |
| Substituir | `REPLACE(t, 'a', 'b')` | `REPLACE(t, 'a', 'b')` | `REPLACE(t, 'a', 'b')` |
| Data de hoje | `CAST(GETDATE() AS DATE)` | `CURRENT_DATE` | `CURDATE()` |
| Data e hora atual | `GETDATE()` | `NOW()` | `NOW()` |
| Ano da data | `YEAR(d)` | `EXTRACT(YEAR FROM d)` | `YEAR(d)` |
| Somar 30 dias | `DATEADD(DAY, 30, d)` | `d + INTERVAL '30 days'` | `DATE_ADD(d, INTERVAL 30 DAY)` |
| Diferença em dias | `DATEDIFF(DAY, d1, d2)` | `d2 - d1` | `DATEDIFF(d2, d1)` |
| Formatar dd/mm/aaaa | `FORMAT(d, 'dd/MM/yyyy')` | `TO_CHAR(d, 'DD/MM/YYYY')` | `DATE_FORMAT(d, '%d/%m/%Y')` |
| Arredondar | `ROUND(x, 2)` | `ROUND(x, 2)` | `ROUND(x, 2)` |
| Converter tipo | `CAST(x AS INT)` ou `CONVERT(INT, x)` | `CAST(x AS INT)` ou `x::int` | `CAST(x AS SIGNED)` |
| Trocar NULL por valor | `COALESCE(x, 0)` ou `ISNULL(x, 0)` | `COALESCE(x, 0)` | `COALESCE(x, 0)` ou `IFNULL(x, 0)` |
| Evitar divisão por zero | `x / NULLIF(y, 0)` | `x / NULLIF(y, 0)` | `x / NULLIF(y, 0)` |

### Ordem de execução de uma consulta

O banco não lê a consulta na ordem em que ela é escrita. Por isso um apelido criado no `SELECT` não pode ser usado no `WHERE`, mas pode no `ORDER BY`.

- 1º `FROM` e `JOIN`: monta as tabelas
- 2º `WHERE`: filtra as linhas
- 3º `GROUP BY`: agrupa
- 4º `HAVING`: filtra os grupos
- 5º `SELECT`: escolhe e calcula as colunas (inclui funções de janela)
- 6º `DISTINCT`: remove repetidos
- 7º `ORDER BY`: ordena
- 8º `LIMIT`, `TOP` ou `FETCH`: corta o resultado

### Esqueleto completo

```
WITH base AS (SELECT ... FROM ...)       -- opcional
SELECT DISTINCT t1.coluna, SUM(t2.valor) AS total
FROM tabela1 t1
LEFT JOIN tabela2 t2 ON t2.id_t1 = t1.id
WHERE t1.status = 'ativo'
GROUP BY t1.coluna
HAVING SUM(t2.valor) > 1000
ORDER BY total DESC
LIMIT 10;                                -- TOP 10 no SQL Server
```

## Comparativo rápido: Python, Java, R e JavaScript

As quatro linguagens resolvem as mesmas tarefas com ferramentas diferentes: Python, R e JavaScript instalam pacotes por comando, enquanto no Java as dependências ficam declaradas no `pom.xml` ou no `build.gradle`.

| Tarefa | Python | Java | R | JavaScript |
| --- | --- | --- | --- | --- |
| Ver a versão | `python --version` | `java -version` | `R --version` | `node --version` |
| Console interativo | `python` | `jshell` | `R` | `node` |
| Executar um script | `python script.py` | `java Main.java` ou `java -jar app.jar` | `Rscript script.R` | `node arquivo.js` |
| Executar uma expressão | `python -c "print(1)"` | `jshell` | `Rscript -e "print(1)"` | `node -e "console.log(1)"` |
| Compilar | Não precisa | `javac Main.java` | Não precisa | Não precisa (TypeScript: `npx tsc`) |
| Gerenciador de versões | `pyenv`, `uv`, `conda` | `SDKMAN`, `jenv` | `rig` | `nvm`, `fnm`, `Volta` |
| Trocar de versão | `pyenv local 3.12` ou `uv python pin 3.12` | `sdk use java 21.0.5-tem` | `rig default 4.3` | `nvm use 22` |
| Ambiente isolado | `python -m venv venv` | Dependências por projeto no `pom.xml` ou `build.gradle` | `renv::init()` | Pasta `node_modules` em cada projeto |
| Instalar pacote | `pip install pacote` | Declarar no `pom.xml` ou `build.gradle` e rodar `mvn install` ou `gradle build` | `install.packages("pacote")` | `npm install pacote` |
| Listar pacotes | `pip list` | `mvn dependency:tree` ou `gradle dependencies` | `installed.packages()` | `npm ls --depth=0` |
| Remover pacote | `pip uninstall pacote` | Tirar do `pom.xml` ou `build.gradle` | `remove.packages("pacote")` | `npm uninstall pacote` |
| Salvar as dependências | `pip freeze > requirements.txt` | Já ficam no `pom.xml` ou `build.gradle` | `renv::snapshot()` | Já ficam no `package.json` e no `package-lock.json` |
| Recriar as dependências | `pip install -r requirements.txt` | `mvn install` ou `gradle build` | `renv::restore()` | `npm install` ou `npm ci` |
| Rodar testes | `pytest` | `mvn test` ou `gradle test` | `devtools::test()` | `npm test` ou `npx jest` |
| Empacotar | `python -m build` ou `pyinstaller --onefile script.py` | `mvn package` ou `jpackage` | `R CMD build pasta` | `npm run build` ou `npm pack` |
| Ajuda | `help(x)` ou `python -m pydoc x` | `javadoc` e a documentação da Oracle | `?x` | `node --help` ou `npm help comando` |
| Sair do console | `exit()` | `/exit` | `q()` | `.exit` |

### Dicas que valem para as quatro

- Use um ambiente por projeto: `venv` no Python, `renv` no R, wrapper (`mvnw` ou `gradlew`) no Java e `node_modules` no JavaScript.
- Fixe as versões das dependências em arquivo (`requirements.txt`, `renv.lock`, `pom.xml`, `package-lock.json`) para recriar o ambiente em outra máquina.
- A opção de ajuda quase sempre existe: `python -h`, `pip help`, `java --help`, `javac --help`, `mvn help:help`, `gradle help`, `R --help`, `node --help`, `npm help`.
- Comando "não reconhecido" costuma ser problema de `PATH`: confira com `where` (Windows) ou `which` (Linux/Mac).
- Os separadores mudam entre sistemas: caminhos com `\` no Windows e `/` no Linux/Mac, e classpath do Java com `;` no Windows e `:` no Linux/Mac.
- Em rede corporativa com proxy, configure o proxy em cada ferramenta: `pip --proxy`, `npm config set proxy`, `.Renviron` no R e as opções de proxy do Maven e do Gradle.
- Versões e nomes de pacotes de instalação (winget, brew, apt) mudam com o tempo: confirme com `--help` ou na documentação oficial antes de usar em produção.

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var LN={py:'Python',java:'Java',r:'R',js:'JavaScript',sql:'SQL',cmp:'Comparativo'};
var ORDER=['py','java','r','js','sql','cmp'];
var QUICK=['venv','pip install','pyenv','JAVA_HOME','mvn clean install','renv','npm install','nvm','SELECT','JOIN'];
var norm=function(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()};
var esc=function(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var pl=function(s){return s.replace(/`/g,'')};
var ICON='<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1"/></svg>';

/* ---------- Leitura do conteúdo ---------- */
function splitRow(l){
  return l.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(function(c){return c.trim().replace(/\\\|/g,'|')});
}
function parse(src){
  var L=src.replace(/\r/g,'').split('\n'),secs=[],cur=null,i=0;
  while(i<L.length){
    var l=L[i],m;
    if(l.indexOf('## ')===0){
      var title=l.slice(3).trim();
      m=title.match(/^(Python|Java|R|JavaScript|SQL): (.*)$/);
      var lang=m?{Python:'py',Java:'java',R:'r',JavaScript:'js',SQL:'sql'}[m[1]]:'cmp';
      var t=m?(/^(npm|pip)\b/.test(m[2])?m[2]:m[2].charAt(0).toUpperCase()+m[2].slice(1)):title;
      cur={id:'s'+secs.length,title:t,lang:lang,blocks:[]};secs.push(cur);i++;continue;
    }
    if(!cur){i++;continue;}
    if(l.indexOf('### ')===0){cur.blocks.push({t:'h3',text:l.slice(4).trim()});i++;continue;}
    if(l.indexOf('```')===0){var buf=[];i++;while(i<L.length&&L[i].indexOf('```')!==0){buf.push(L[i]);i++;}i++;cur.blocks.push({t:'code',text:buf.join('\n')});continue;}
    if(l.charAt(0)==='|'){var rows=[];while(i<L.length&&L[i].charAt(0)==='|'){rows.push(splitRow(L[i]));i++;}cur.blocks.push({t:'table',head:rows[0],rows:rows.slice(2)});continue;}
    if(l.indexOf('- ')===0){var items=[];while(i<L.length&&L[i].indexOf('- ')===0){items.push(L[i].slice(2));i++;}cur.blocks.push({t:'ul',items:items});continue;}
    if(l.trim()===''){i++;continue;}
    var pb=[];
    while(i<L.length&&L[i].trim()!==''&&!/^(#{2,3} |```|\||- )/.test(L[i])){pb.push(L[i]);i++;}
    cur.blocks.push({t:'p',text:pb.join(' ')});
  }
  return secs;
}
var SECS=parse($('#md').textContent.trim());
var TOTAL=0;
SECS.forEach(function(s){
  s.blocks.forEach(function(b){
    if(b.t==='table'){
      b.rows=b.rows.map(function(c){return {c:c,n:norm(pl(c.join(' ')))}});
      var c0=0,c1=0;
      b.rows.forEach(function(r){if(/`/.test(r.c[0]))c0++;if(r.c[1]&&/`/.test(r.c[1]))c1++;});
      b.cmd=b.head.length<=2?(c1>c0?1:0):-1;
      TOTAL+=b.rows.length;
    }else if(b.t==='ul'){b.n=norm(pl(b.items.join(' ')));}
    else if(b.t!=='h3'){b.n=norm(pl(b.text));}
  });
});

/* ---------- Texto com destaque ---------- */
function hl(s,T){
  if(!T.length)return esc(s);
  var n='',map=[],i,k;
  for(i=0;i<s.length;i++){var m=norm(s.charAt(i));for(k=0;k<m.length;k++){n+=m.charAt(k);map.push(i);}}
  var mark=new Uint8Array(s.length);
  T.forEach(function(t){var p=0;while((p=n.indexOf(t,p))>-1){for(k=p;k<p+t.length;k++)mark[map[k]]=1;p+=t.length;}});
  var out='',on=false;
  for(i=0;i<s.length;i++){
    if(mark[i]&&!on){out+='<mark>';on=true;}
    if(!mark[i]&&on){out+='</mark>';on=false;}
    out+=esc(s.charAt(i));
  }
  return on?out+'</mark>':out;
}
function inl(s,T){
  return s.split(/(`[^`]+`)/).map(function(seg){
    if(seg.length>2&&seg.charAt(0)==='`'&&seg.charAt(seg.length-1)==='`')return '<code>'+hl(seg.slice(1,-1),T)+'</code>';
    return hl(seg,T);
  }).join('');
}

/* ---------- Busca e filtros ---------- */
var state={q:'',lang:'all'};
function view(){
  var T=norm(state.q).split(/\s+/).filter(Boolean);
  var hits={py:0,java:0,r:0,js:0,sql:0,cmp:0},out=[];
  SECS.forEach(function(s){
    var groups=[{h:null,items:[]}],g=groups[0];
    s.blocks.forEach(function(b){if(b.t==='h3'){g={h:b,items:[]};groups.push(g);}else g.items.push(b);});
    var kept=[],n=0;
    groups.forEach(function(g){
      var items=[];
      g.items.forEach(function(b){
        if(b.t==='table'){
          var rows=T.length?b.rows.filter(function(r){return T.every(function(t){return r.n.indexOf(t)>-1})}):b.rows;
          if(rows.length){items.push({t:'table',head:b.head,cmd:b.cmd,rows:rows});n+=rows.length;}
        }else if(!T.length||T.every(function(t){return b.n.indexOf(t)>-1})){items.push(b);if(T.length)n++;}
      });
      if(items.length){if(g.h)kept.push(g.h);kept=kept.concat(items);}
    });
    if(kept.length){out.push({s:s,kept:kept,n:n});hits[s.lang]+=n;}
  });
  return {T:T,hits:hits,out:out};
}
function tbl(b,T){
  var two=b.head.length<=2;
  var h='<div class="tw"><table data-cmd="'+(two?b.cmd:'x')+'"><thead><tr>'+b.head.map(function(c){return '<th>'+inl(c,[])+'</th>'}).join('')+'</tr></thead><tbody>';
  b.rows.forEach(function(r){
    h+='<tr>'+r.c.map(function(c,k){
      var codes=[],re=/`([^`]+)`/g,m;
      while((m=re.exec(c)))codes.push(m[1]);
      if(two&&k===b.cmd&&codes.length)return '<td><div class="cw"><span>'+inl(c,T)+'</span><button class="cp" type="button" aria-label="Copiar comando" title="Copiar" data-c="'+esc(codes.join('\n'))+'">'+ICON+'</button></div></td>';
      return '<td>'+inl(c,T)+'</td>';
    }).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function sec(o,T){
  var s=o.s,h='<section class="sec '+s.lang+'" id="'+s.id+'"><div class="sh"><span class="lang">'+LN[s.lang]+'</span><h2>'+esc(s.title)+'</h2><span class="cnt">'+o.n+' '+(T.length?(o.n===1?'resultado':'resultados'):(s.lang==='cmp'?'linhas':'comandos'))+'</span></div>';
  o.kept.forEach(function(b){
    if(b.t==='h3')h+='<h3>'+esc(b.text)+'</h3>';
    else if(b.t==='p')h+='<p>'+inl(b.text,T)+'</p>';
    else if(b.t==='ul')h+='<ul>'+b.items.map(function(x){return '<li>'+inl(x,T)+'</li>'}).join('')+'</ul>';
    else if(b.t==='code')h+='<div class="pre"><pre><code>'+esc(b.text)+'</code></pre><button class="cp" type="button" aria-label="Copiar bloco" title="Copiar" data-c="'+esc(b.text)+'">'+ICON+'</button></div>';
    else if(b.t==='table')h+=tbl(b,T);
  });
  return h+'</section>';
}
function navHtml(v){
  var by={},m={},h='';
  SECS.forEach(function(s){(by[s.lang]=by[s.lang]||[]).push(s)});
  v.out.forEach(function(o){m[o.s.id]=o});
  ORDER.forEach(function(l){
    if(state.lang!=='all'&&state.lang!==l)return;
    var links=(by[l]||[]).filter(function(s){return m[s.id]});
    if(!links.length)return;
    h+='<div class="ng '+l+'"><div class="gh"><i class="dot"></i>'+LN[l]+'</div>'+links.map(function(s){
      return '<a class="nl" href="#'+s.id+'" data-id="'+s.id+'"><span>'+esc(s.title)+'</span>'+(state.q?'<b>'+m[s.id].n+'</b>':'')+'</a>';
    }).join('')+'</div>';
  });
  return h;
}
function quickHtml(){return QUICK.map(function(q){return '<button class="qs" type="button" data-q="'+esc(q)+'">'+esc(q)+'</button>'}).join('')}
var spy;
function observe(){
  if(spy)spy.disconnect();
  if(!('IntersectionObserver' in window))return;
  var hh=$('#top').offsetHeight;
  spy=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      var id=e.target.closest('.sec').id;
      $$('.nl').forEach(function(a){a.classList.toggle('on',a.dataset.id===id)});
    });
  },{rootMargin:'-'+(hh+8)+'px 0px -70% 0px'});
  $$('.sec h2').forEach(function(x){spy.observe(x)});
}
function updateChips(hits){
  var tot=hits.py+hits.java+hits.r+hits.js+hits.sql+hits.cmp;
  $$('.fchip').forEach(function(c){
    var l=c.dataset.l;
    c.setAttribute('aria-pressed',String(state.lang===l));
    c.querySelector('.n').textContent=l==='all'?tot:hits[l];
  });
}
function render(){
  var v=view(),T=v.T;
  document.body.classList.toggle('searching',T.length>0);
  var list=v.out.filter(function(o){return state.lang==='all'||o.s.lang===state.lang});
  var h='';
  if(T.length||state.lang!=='all'){
    var total=list.reduce(function(a,o){return a+o.n},0);
    h+='<div class="res">'+(T.length?'<strong>'+total+'</strong> '+(total===1?'resultado':'resultados')+' para “'+esc(state.q.trim())+'”':'Mostrando só '+LN[state.lang])+'<button class="lnk" type="button" data-act="clear">Limpar filtros</button></div>';
  }
  if(!list.length)h+='<div class="empty"><h2>Nada encontrado</h2><p>Tente um termo mais curto ou outra grafia. Estes exemplos funcionam:</p><div class="quick">'+quickHtml()+'</div></div>';
  else h+=list.map(function(o){return sec(o,T)}).join('');
  $('#content').innerHTML=h;
  $('#nav').innerHTML=navHtml(v);
  updateChips(v.hits);
  observe();
}

/* ---------- Interações ---------- */
var input=$('#q'),sbox=$('#sbox'),tt;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2200);}
function copy(text){
  function fallback(){
    var a=document.createElement('textarea');a.value=text;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();return ok;
  }
  function done(ok){toast(ok?'Copiado':'Não foi possível copiar. Selecione o texto e use Ctrl+C.');}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done(true)},function(){done(fallback())});}
  else done(fallback());
}
function setQuery(v){input.value=v;state.q=v;sbox.classList.toggle('has',!!v);render();}
var deb;
input.addEventListener('input',function(){
  sbox.classList.toggle('has',!!input.value);
  clearTimeout(deb);deb=setTimeout(function(){state.q=input.value;render();},80);
});
document.addEventListener('click',function(e){
  var t=e.target.closest('.cp,[data-q],[data-l],[data-act],.nl');
  if(!t)return;
  if(t.classList.contains('cp')){copy(t.dataset.c);return;}
  if(t.dataset.q!==undefined){setQuery(t.dataset.q);window.scrollTo(0,0);return;}
  if(t.dataset.l!==undefined){state.lang=t.dataset.l;render();return;}
  if(t.dataset.act==='clear'){state.lang='all';setQuery('');return;}
  if(t.classList.contains('nl')){
    e.preventDefault();
    var el=document.getElementById(t.dataset.id);
    document.body.classList.remove('navopen');$('#navbtn').setAttribute('aria-expanded','false');
    if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  }
});
document.addEventListener('keydown',function(e){
  var tag=document.activeElement&&document.activeElement.tagName;
  if((e.key==='/'&&tag!=='INPUT'&&tag!=='TEXTAREA')||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();input.focus();input.select();}
  else if(e.key==='Escape'){
    if(document.body.classList.contains('navopen')){document.body.classList.remove('navopen');return;}
    if(document.activeElement===input){if(input.value){setQuery('');}else input.blur();}
  }
});
$('#theme').addEventListener('click',function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';
});
$('#navbtn').addEventListener('click',function(){
  var o=document.body.classList.toggle('navopen');this.setAttribute('aria-expanded',String(o));
});
function setHdr(){document.documentElement.style.setProperty('--hdr',$('#top').offsetHeight+'px');}

/* ---------- Início ---------- */
(function init(){
  var f=$('#filters'),h='';
  [['all','Tudo'],['py','Python'],['java','Java'],['r','R'],['js','JavaScript'],['sql','SQL'],['cmp','Comparativo']].forEach(function(x){
    h+='<button class="fchip '+(x[0]==='all'?'':x[0])+'" type="button" data-l="'+x[0]+'" aria-pressed="false"><i class="dot"></i><span>'+x[1]+'</span><span class="n"></span></button>';
  });
  f.innerHTML=h;
  $('#stats').textContent=TOTAL+' comandos em '+SECS.length+' seções. Atualizado em 24 de novembro de 2026.';
  $('#quick').innerHTML='<span>Buscas rápidas</span>'+quickHtml();
  render();setHdr();
  window.addEventListener('resize',setHdr);
  if('ResizeObserver' in window)new ResizeObserver(setHdr).observe($('#top'));
})();

/* ---------- PDF ---------- */
var COL={py:[43,100,174],java:[184,63,11],r:[107,63,196],js:[21,128,61],sql:[190,24,93],cmp:[14,22,38]};
function buildPdf(){
  var J=window.jspdf.jsPDF,doc=new J({unit:'pt',format:'a4'});
  var W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  var M=42,TOP=56,BOT=H-52,CW=W-2*M,y;
  function ink(){doc.setTextColor(14,22,38)}
  function need(h){if(y+h>BOT){doc.addPage();y=TOP;}}
  /* capa */
  ['py','java','r','js','sql'].forEach(function(k,i){var c=COL[k];doc.setFillColor(c[0],c[1],c[2]);doc.rect(M+i*60,72,52,6,'F');});
  ink();doc.setFont('helvetica','bold');doc.setFontSize(30);doc.text('Guia de comandos',M,132);
  doc.setFont('helvetica','normal');doc.setFontSize(18);doc.text('Python, Java, R, JavaScript e SQL',M,160);
  doc.setFontSize(10);doc.setTextColor(86,97,118);doc.text('Atualizado em 24 de novembro de 2026',M,184);
  y=236;ink();doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Sumário',M,y);y+=22;
  ORDER.forEach(function(l){
    var list=SECS.filter(function(s){return s.lang===l});if(!list.length)return;
    var c=COL[l];doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(c[0],c[1],c[2]);doc.text(LN[l],M,y);y+=15;
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(40,48,66);
    list.forEach(function(s){doc.text(s.title,M+12,y);y+=14;});y+=8;
  });
  doc.addPage();y=TOP;
  SECS.forEach(function(s){
    var c=COL[s.lang];need(150);
    doc.setFillColor(c[0],c[1],c[2]);doc.rect(M,y,CW,2,'F');y+=20;
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(c[0],c[1],c[2]);doc.text(LN[s.lang],M,y);y+=17;
    ink();doc.setFontSize(15);var tl=doc.splitTextToSize(s.title,CW);doc.text(tl,M,y);y+=tl.length*18+4;
    s.blocks.forEach(function(b){
      if(b.t==='h3'){need(60);y+=8;doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(c[0],c[1],c[2]);doc.text(pl(b.text),M,y);y+=15;}
      else if(b.t==='p'){
        doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(40,48,66);
        doc.splitTextToSize(pl(b.text),CW).forEach(function(ln){need(14);doc.text(ln,M,y);y+=13;});y+=5;
      }else if(b.t==='ul'){
        doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(40,48,66);
        b.items.forEach(function(it){
          var ls=doc.splitTextToSize(pl(it),CW-16);
          ls.forEach(function(ln,k){need(14);if(k===0)doc.text('-',M+3,y);doc.text(ln,M+16,y);y+=13;});y+=2;
        });y+=4;
      }else if(b.t==='code'){
        var ls=b.text.split('\n'),hg=ls.length*11+14;need(hg);
        doc.setFillColor(238,242,248);doc.rect(M,y,CW,hg,'F');
        doc.setFont('courier','normal');doc.setFontSize(8.5);ink();
        ls.forEach(function(ln,k){doc.text(ln,M+8,y+15+k*11);});y+=hg+10;
      }else if(b.t==='table'){
        var two=b.head.length<=2,w=two?(b.cmd===0?[.5,.5]:[.3,.7]):null,cs={};
        if(w){cs[0]={cellWidth:CW*w[0]};cs[1]={cellWidth:CW*w[1]};}
        doc.autoTable({
          startY:y+2,head:[b.head.map(pl)],body:b.rows.map(function(r){return r.c.map(pl)}),
          margin:{left:M,right:M,top:TOP,bottom:52},theme:'grid',columnStyles:cs,
          styles:{font:'helvetica',fontSize:8.2,cellPadding:{top:3.5,bottom:3.5,left:5,right:5},lineColor:[225,230,238],lineWidth:.5,textColor:[30,38,56],overflow:'linebreak',valign:'top'},
          headStyles:{fillColor:c,textColor:[255,255,255],fontStyle:'bold',fontSize:8.5},
          alternateRowStyles:{fillColor:[247,249,252]},
          didParseCell:function(d){
            if(d.section!=='body')return;
            var raw=b.rows[d.row.index].c[d.column.index];
            if(/`/.test(raw)&&(two?d.column.index===b.cmd:/^`[^`]+`$/.test(raw.trim()))){d.cell.styles.font='courier';d.cell.styles.fontSize=7.8;}
          }
        });
        y=doc.lastAutoTable.finalY+14;
      }
    });
    y+=10;
  });
  var n=doc.internal.getNumberOfPages(),p;
  for(p=2;p<=n;p++){
    doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,130,150);
    doc.text('Guia de comandos: Python, Java, R, JavaScript e SQL',M,28);
    doc.text('Página '+(p-1)+' de '+(n-1),W-M,H-26,{align:'right'});
    doc.setDrawColor(225,230,238);doc.line(M,34,W-M,34);
  }
  return doc;
}
var pdfBtn=$('#pdf'),busy=false;
function pdfLabel(t){$('#pdft').textContent=t;}
function printFallback(why){toast(why+' Abrindo a impressão: escolha Salvar como PDF.');setTimeout(function(){try{window.print();}catch(e){}},400);}
pdfBtn.addEventListener('click',function(){
  if(busy)return;
  if(!(window.jspdf&&window.jspdf.jsPDF)){printFallback('A biblioteca de PDF não carregou.');return;}
  busy=true;pdfBtn.disabled=true;pdfLabel('Gerando PDF');
  setTimeout(function(){
    var blob,name='guia-de-comandos-python-java-r-javascript.pdf';
    try{blob=buildPdf().output('blob');}catch(err){busy=false;pdfBtn.disabled=false;pdfLabel('Gerar PDF');printFallback('Não foi possível montar o PDF.');return;}
    var cl=window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null);
    cl.then(function(dl){
      if(!dl)throw {code:'unavailable'};
      return dl.save({filename:name,data:blob}).then(function(){toast('PDF salvo');});
    }).catch(function(e){
      var c=e&&e.code;
      if(c==='declined')toast('Download cancelado.');
      else if(c==='rate_limited')toast('Aguarde um instante e tente de novo.');
      else printFallback('Este ambiente não permite salvar o arquivo direto.');
    }).then(function(){busy=false;pdfBtn.disabled=false;pdfLabel('Gerar PDF');});
  },30);
});
})();
